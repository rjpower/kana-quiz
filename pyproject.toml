[project]
name = "kana-quiz"
version = "0.1.0"
description = "Japanese vocabulary drill with Duolingo-style timed multiple choice and SM-2 spaced repetition."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9",
    "openai>=1.40",
    "google-genai>=0.3",
    "google-auth>=2.0",
    "requests>=2.31",
    "pykakasi>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/kana_quiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"
